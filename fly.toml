app = "zapchat-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5000"
  MONGODB_URI = "mongodb+srv://abuzar01043:G05xQ9S2WvoDTp9p@cluster0.1knivxo.mongodb.net/zapchat?retryWrites=true&w=majority"
  JWT_SECRET = "your_secret_key"

[[services]]
  protocol = "tcp"

name: Build All Apps (Flutter & Web APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-flutter-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Flutter Release APK
        run: |
          cd zapchat_flutter
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Flutter APK
        uses: actions/upload-artifact@v4
        with:
          name: ZapChat-Flutter-APK
          path: zapchat_flutter/build/app/outputs/flutter-apk/app-release.apk

  build-web-capacitor-apk:
    name: Build Web-Capacitor APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Web App & Capacitor Android APK
        run: |
          cd frontend
          npm install
          npm run build
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Capacitor Web APK
        uses: actions/upload-artifact@v4
        with:
          name: ZapChat-Web-Capacitor-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
